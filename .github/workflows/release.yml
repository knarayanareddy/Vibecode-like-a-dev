name: release

# Governed v0.20+ release pipeline: full verification, CycloneDX 1.5 SBOM,
# npm OIDC provenance publishing, and signed GitHub Release artefacts.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, verify and upload tarball + SBOM without publishing'
        required: false
        default: true
        type: boolean

jobs:
  release:
    name: Verify, SBOM, pack & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Full compiler, runtime, sandbox, eval, README & SBOM gate
        run: |
          npm run check
          node scripts/check-readme-metrics.mjs
          node scripts/generate-sbom.mjs --check
          node factory/cli.mjs sandbox conformance

      - name: Verify Git tag matches package.json version
        id: meta
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == v* && "${GITHUB_REF_NAME}" != "v${PKG_VER}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VER}"
            exit 1
          fi

      - name: Pack deterministic tarball and SHA-256 checksums
        id: pack
        run: |
          TARBALL="$(npm pack --silent | tail -n 1)"
          sha256sum "${TARBALL}" sbom.cdx.json > SHA256SUMS.txt
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-v${{ steps.meta.outputs.version }}
          path: |
            vibecode-like-a-dev-*.tgz
            sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 30

      - name: Publish to npm with OIDC provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public

      - name: Publish GitHub Release with SBOM and SHA-256 checksums
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.pack.outputs.tarball }}" \
            sbom.cdx.json \
            SHA256SUMS.txt \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes
