name: check

# Every PR check is deterministic and unprivileged. Live provider evaluation lives
# in live-agent-benchmark.yml and must be explicitly approved.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minimum-node:
    # The README and package.json both claim Node 22. A claim nothing runs on is a
    # claim that rots (BUG-11): this job pins the documented minimum, so lowering
    # or raising it without updating the docs, the guard and the engine field fails.
    name: Minimum supported Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.0.0

      - name: Engine field matches the documented minimum
        run: node -e "const m=require('./package.json'); if (m.engines.node !== '>=22') { console.error('engines.node is ' + m.engines.node); process.exit(1); }"

      - name: The CLI refuses an unsupported runtime
        run: |
          set -e
          node --input-type=module -e "
            Object.defineProperty(process.versions, 'node', { value: '20.20.2', configurable: true });
            await import('./factory/cli.mjs');
            console.error('the guard did not fire on Node 20');
            process.exit(1);
          " 2>guard.log && { echo 'guard did not fire'; exit 1; }
          grep -q 'requires Node 22 or newer' guard.log

      - name: Full portable suite on the minimum
        run: npm test

  core:
    name: Linux core specification checks
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # No install step: the CLI and the shipped spec checker have no dependencies.
      - name: Lint
        run: npm run lint

      - name: Index is up to date
        run: node factory/cli.mjs index --check

      - name: Tests
        run: npm test

      - name: Committed example packet verifies
        run: node factory/cli.mjs verify examples/retro-board/spec

      # One recursive compiler-to-packet comparison is shared with npm run check.
      # It covers all top-level documents and nested enforcement assets.
      - name: Generated packets are recursively in sync with the generator
        run: node scripts/check-packet-sync.mjs

      - name: README metrics and line budget match source data
        run: npm run readme-check

      - name: CycloneDX SBOM is current and zero-dependency
        run: npm run sbom -- --check

      - name: Environment and self-packet doctor passes
        run: node factory/cli.mjs doctor

      # The packet ships a gate runner. Dogfooding it against this repository is the
      # only check that proves the generated file executes at all.
      - name: Self-spec gates pass
        run: node specs/enforcement/gates.mjs --repo . --strict

      # --require-assertions turns a hollow anchored test into an error. Without it a
      # test can carry the @req anchor, import the product and assert nothing; the
      # report says so, but the job still passes, so nothing stops an agent from
      # weakening a test to make a build green. It is opt-in upstream because a
      # half-written test is normal during development, which is why the packet
      # template leaves it off and this repository turns it on.
      - name: This repository passes its own drift guard
        run: node specs/spec-check.mjs --repo . --strict --require-assertions

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History scanning is meaningless against a shallow checkout.
          fetch-depth: 0
      - name: Gitleaks scans reachable Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 consumes configuration through this environment
          # variable; it deliberately declares no action inputs.
          GITLEAKS_CONFIG: factory/gates/gitleaks.toml

  node-22-minimum:
    name: Linux core suite — minimum Node 22
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the supported floor separately from the 22.x lanes, which follow
      # the newest available Node 22 release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.0.0
      - name: Full core Node test suite at the supported floor
        # The pinned floor is intentionally retained; capture bounded TAP context
        # because hosted logs for intermittent runner failures are not always retrievable.
        shell: bash
        run: |
          log=/tmp/vld-minimum-node-test.log
          set +e
          npm test >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            failure=$(grep -m1 -A 60 '^not ok' "$log" | tr '\n' ' ' || true)
            echo "::error title=Minimum Node test failure::${failure:-npm test failed without a TAP failure record}"
            exit "$status"
          fi

  integration:
    name: Linux integration fixtures
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Adoption runs against this repository
        run: node factory/cli.mjs adopt . -o /tmp/self-profile.json --force

      - name: VS Code Studio extension package tests
        working-directory: factory/studio/vscode
        run: npm test

      - name: MCP server answers tools/list
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node factory/cli.mjs mcp 2>/dev/null \
            | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const lines=b.trim().split("\n").map(JSON.parse);const tools=lines.find(l=>l.id===2);if(tools.result.tools.length!==10)process.exit(1);console.log("10 MCP tools advertised")})'

      # A generated delta starts with pending evidence by design. A minimal reviewed-record
      # fixture proves the positive evidence lifecycle; it is test data, never a CI release approval.
      - name: Delta spec and reviewed-evidence round trip
        run: |
          node factory/cli.mjs change init /tmp/change > /dev/null
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/tmp/change/change.json"));delete c.$help;fs.writeFileSync("/tmp/change/change.json",JSON.stringify(c,null,2))'
          node factory/cli.mjs change examples/retro-board/spec /tmp/change/change.json -o /tmp/change/out
          project=/tmp/change-project
          mkdir -p "$project"
          node factory/cli.mjs module enable review --project "$project"
          node - "$project" /tmp/change/out <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [project, change] = process.argv.slice(2);
          const delta = JSON.parse(fs.readFileSync(path.join(change, 'delta.json'), 'utf8'));
          const ids = [...(delta.added ?? []).map((entry) => entry.id), ...(delta.modified ?? []).map((entry) => entry.target.id), ...(delta.removed ?? []).map((entry) => entry.target.id)];
          const review = ['# Review Brief: CI delta evidence', '', '**Status:** Approved', '', '## Change Summary', '', 'The generated delta was reviewed against the resulting manifest, expected blast radius, and release boundary.', '', '## Requirements Under Review', '', ids.map((id) => `- ${id}: Reviewed against acceptance criteria and change evidence.`).join('\n'), '', '## Risk and Invariants', '', 'The review preserves the changed requirements, their failure paths, and the stated verification method.', '', '## Evidence', '', 'The packet and change verification commands completed with no findings before the accountable review.', '', '## Review Questions', '', 'Does every changed requirement retain a falsifiable acceptance criterion and an executable verification path?', '', '## Decision', '', 'Approved after reviewing the linked evidence and the explicit rollback conditions.', ''].join('\n');
          fs.mkdirSync(path.join(project, 'docs'), { recursive: true });
          fs.writeFileSync(path.join(project, 'docs', 'review-brief.md'), review);
          const evidenceFile = path.join(change, 'evidence.json');
          const evidence = JSON.parse(fs.readFileSync(evidenceFile, 'utf8'));
          evidence.artifacts = [{ kind: 'review-brief', file: 'docs/review-brief.md', requirements: ids }];
          fs.writeFileSync(evidenceFile, `${JSON.stringify(evidence, null, 2)}\n`);
          const narrativeFile = path.join(change, 'evidence.md');
          fs.writeFileSync(narrativeFile, fs.readFileSync(narrativeFile, 'utf8').replace('**Status:** Pending', '**Status:** Approved'));
          NODE
          node factory/cli.mjs change verify /tmp/change/out --project "$project"

  packed-distribution:
    name: Linux packed-install distribution
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # A source checkout can hide omitted package files or an invalid bin link. Exercise
      # the tarball users receive, including compiler, export, mission, module, artifact and
      # reviewed shared-store flows. No registry, credentials or network agent calls.
      - name: Packed-install distribution journey
        run: |
          set -eu
          work=$(mktemp -d)
          pack="$work/pack"
          install="$work/install"
          mkdir -p "$pack"
          npm pack --pack-destination "$pack" > /dev/null
          tarball=$(find "$pack" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          npm install --ignore-scripts --prefix "$install" "$tarball" > /dev/null
          vld="$install/node_modules/.bin/vld"
          "$vld" --version

          cp examples/retro-board/profile.json "$work/profile.json"
          "$vld" compile "$work/profile.json" --out "$work/packet"
          "$vld" verify "$work/packet"
          "$vld" export spec-kit "$work/packet" --out "$work/spec-kit"
          test -f "$work/spec-kit/.specify/memory/constitution.md"

          project="$work/project"
          mkdir -p "$project" "$work/store"
          "$vld" module enable product --project "$project"
          "$vld" store init "$work/store" --id team-playbook --title 'Team playbook'
          cat > "$work/store/product-brief.md" <<'EOF'
          # Product Brief: shared template

          **Status:** Draft

          ## Problem

          [Describe the reviewed problem.]
          EOF
          cat > "$work/store/vld-store.json" <<'EOF'
          {"schemaVersion":1,"id":"team-playbook","title":"Team playbook","assets":[{"id":"product-brief-template","kind":"artifact-template","artifact":"product-brief","file":"product-brief.md"}]}
          EOF
          git -C "$work/store" init -q
          git -C "$work/store" config user.email vld-ci@example.test
          git -C "$work/store" config user.name 'VLD CI'
          git -C "$work/store" add .
          git -C "$work/store" commit -qm initial
          "$vld" store add team-playbook "file://$work/store" --project "$project"
          "$vld" artifact init product-brief --from-store team-playbook/product-brief-template --project "$project"

          # Mission creation must also work from the packed CLI. It reads a verified
          # project-local packet and resolves HEAD, but cannot launch an agent or mutate refs.
          cp -R "$work/packet" "$project/specs"
          git -C "$project" init -q
          git -C "$project" config user.email vld-ci@example.test
          git -C "$project" config user.name 'VLD CI'
          git -C "$project" add specs
          git -C "$project" commit -qm mission-base
          node - "$project" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const project = process.argv[2];
          const requirements = JSON.parse(fs.readFileSync(path.join(project, 'specs', 'spec.json'), 'utf8')).requirements.map((entry) => entry.id);
          const definition = {
            schemaVersion: 1,
            id: 'packed-mission',
            title: 'Verify the packaged mission foundation',
            workPackages: [{
              id: 'packet-work',
              title: 'Verify every packet requirement in one package',
              requirements,
              dependsOn: [],
              resourceClaims: { paths: ['src/**', 'test/**'] }
            }]
          };
          fs.writeFileSync(path.join(project, 'mission-definition.json'), `${JSON.stringify(definition, null, 2)}\n`);
          NODE
          "$vld" mission init mission-definition.json --packet specs --project "$project"
          "$vld" mission validate missions/packed-mission/mission.json --project "$project"
          test -f "$project/missions/packed-mission/mission.json"

          # The packed CLI also owns the narrow manual workspace foundation. This
          # allocation is local fixed-argv Git only: no agent, command runner, push or merge.
          workspace_id=$("$vld" workspace create missions/packed-mission/mission.json packet-work --project "$project" --json \
            | node -e 'let input="";process.stdin.on("data",part=>input+=part).on("end",()=>process.stdout.write(JSON.parse(input).allocation.id))')
          test -n "$workspace_id"
          "$vld" workspace status missions/packed-mission/mission.json --project "$project"
          "$vld" workspace remove missions/packed-mission/mission.json packet-work --project "$project"

          # M3 owns fake-run receipts/leases only. This proves the packed CLI can
          # initialize and inspect Runtime state without launching an agent/process.
          "$vld" runtime init missions/packed-mission/mission.json --project "$project"
          runtime_lease=$("$vld" runtime allocate missions/packed-mission/mission.json packet-work --assignee packed-implementer --project "$project" --json \
            | node -e 'let input="";process.stdin.on("data",part=>input+=part).on("end",()=>process.stdout.write(JSON.parse(input).leaseToken))')
          test -n "$runtime_lease"
          "$vld" runtime status missions/packed-mission/mission.json --project "$project"

          # M4's deterministic fake adapter requires the same explicit M2
          # worktree and M3 lease. Keep the lease in shell memory, not CI output.
          "$vld" workspace create missions/packed-mission/mission.json packet-work --project "$project" > /dev/null
          cat > "$project/agent-policy.json" <<'EOF'
          {"schemaVersion":1,"id":"packed-fake-policy","adapter":"fake","mode":"write-workspace","capabilities":{"readWorkspace":true,"writeWorkspace":true,"runDeclaredCommands":false,"network":false,"streamEvents":true,"cancel":true,"reconnect":true,"sandbox":true,"credentialAccess":false,"gitPush":false,"gitMerge":false},"limits":{"durationMs":1000,"outputBytes":1024,"retryBudget":0},"environment":{},"command":{"script":"succeed","executable":null,"args":[]}}
          EOF
          "$vld" runtime agent run missions/packed-mission/mission.json packet-work --policy agent-policy.json --lease-token "$runtime_lease" --project "$project" > /dev/null
          "$vld" runtime agent status missions/packed-mission/mission.json --project "$project"

          printf '%s\n' '<!-- refreshed -->' >> "$work/store/product-brief.md"
          git -C "$work/store" add .
          git -C "$work/store" commit -qm refresh
          acknowledgement=$("$vld" store diff team-playbook --project "$project" --json | node -e 'let input="";process.stdin.on("data",part=>input+=part).on("end",()=>process.stdout.write(JSON.parse(input).next.commit))')
          "$vld" store update team-playbook --acknowledge "$acknowledgement" --project "$project"
          "$vld" store status team-playbook --project "$project"

  acp-v1-bridge:
    name: ACP v1 bridge
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # The optional adapter stays outside Core's dependency tree. This isolated
      # job proves its locked stable-SDK bridge against the fake ACP peer.
      - name: Install optional ACP adapter dependencies
        working-directory: factory/integrations/acp-v1
        run: npm ci --ignore-scripts

      - name: ACP stable v1 fake-peer bridge
        working-directory: factory/integrations/acp-v1
        run: npm test

  evaluations:
    name: Evaluation — ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: library health
            command: node scripts/eval-library.mjs
          - label: specificity
            command: node scripts/eval-specificity.mjs
          - label: MCP routing
            command: node scripts/eval-routing.mjs
          - label: business-rule extraction
            command: node scripts/eval-rules.mjs
          - label: deterministic outcome calibration
            command: node scripts/eval-outcome.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # Calibration uses only checked-in fixtures. It is not live-agent evidence.
      - name: ${{ matrix.label }}
        run: ${{ matrix.command }}

  stress:
    name: Stress — ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: representative ideas
            command: node scripts/stress-test.mjs
          - label: adversarial ideas and invalid profiles
            command: node scripts/stress-adversarial.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: ${{ matrix.label }}
        run: ${{ matrix.command }}

  portable-smoke:
    name: Portable CLI smoke — ${{ matrix.os }} (shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # The dependency-free Node CLI and its portable test suite must work under
      # each supported runner shell. Linux retains the shell-heavy pack journey.
      - name: Full portable test suite
        # Run the same Node suite under Bash on each supported portable runner,
        # sharded deterministically by test file so one slow or hanging file can
        # never starve the lane. Preserve TAP on failure and surface the failing
        # test in an annotation: hosted log blobs are not always retained.
        shell: bash
        run: |
          log=/tmp/vld-portable-test-${{ matrix.shard }}.log
          files=$(node -e "const fs=require('node:fs');const all=fs.readdirSync('factory/test').filter((f)=>f.endsWith('.test.mjs')).sort();const mine=all.filter((_,i)=>i%8===${{ matrix.shard }}-1);process.stdout.write(mine.map((f)=>'factory/test/'+f).join(' '))")
          set +e
          node --test --test-concurrency=1 $files >"$log" 2>&1
          status=$?
          if [ "${{ matrix.shard }}" = "1" ]; then
            node --test factory/studio/vscode/test/*.test.cjs >>"$log" 2>&1
            status=$(( status | $? ))
          fi
          set -e
          tail -n 400 "$log"
          if [ "$status" -ne 0 ]; then
            failure=$(grep -m1 -A 60 '^not ok' "$log" | tr '\n' ' ' || true)
            echo "::error title=Portable Node test failure::${failure:-npm test failed without a TAP failure record}"
            exit "$status"
          fi

  # Roadmap P0.1: run the full verification surface inside the reproducible
  # Debian Bookworm Node 22 container image (Node under /usr/local, git +
  # unshare + bubblewrap installed) and publish the TAP stream as an artifact.
  container-baseline:
    name: Container baseline (Node 22 Bookworm)
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 25
    steps:
      - name: Install sandbox and git tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git util-linux bubblewrap ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify bootstrap prerequisites and non-masked Node prefix
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/bootstrap.sh --strict-prefix

      - name: Run full npm run check and record TAP output
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm run check 2>&1 | tee /tmp/vld-container-check.tap
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            failure=$(grep -m1 -A 60 '^not ok' /tmp/vld-container-check.tap | tr '\n' ' ' || true)
            echo "::error title=Container check failure::${failure:-npm run check failed without a TAP failure record}"
            exit "$status"
          fi

      - name: Upload container check TAP artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-baseline-tap
          path: /tmp/vld-container-check.tap
          retention-days: 14

  # Keep this ID stable for branch protection. It only succeeds once every
  # complete-coverage job above has completed successfully.
  check:
    name: check
    if: ${{ always() }}
    needs: [core, secret-history, node-22-minimum, integration, packed-distribution, acp-v1-bridge, evaluations, stress, portable-smoke, container-baseline]
    runs-on: ubuntu-latest
    # Bound each deterministic job; action SHA upgrades are reviewed in CONTRIBUTING.md.
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          CORE: ${{ needs.core.result }}
          SECRET_HISTORY: ${{ needs.secret-history.result }}
          NODE_22_MINIMUM: ${{ needs.node-22-minimum.result }}
          INTEGRATION: ${{ needs.integration.result }}
          PACKED_DISTRIBUTION: ${{ needs.packed-distribution.result }}
          ACP: ${{ needs.acp-v1-bridge.result }}
          EVALUATIONS: ${{ needs.evaluations.result }}
          STRESS: ${{ needs.stress.result }}
          PORTABLE: ${{ needs.portable-smoke.result }}
          CONTAINER_BASELINE: ${{ needs.container-baseline.result }}
        run: |
          test "$CORE" = success
          test "$SECRET_HISTORY" = success
          test "$NODE_22_MINIMUM" = success
          test "$INTEGRATION" = success
          test "$PACKED_DISTRIBUTION" = success
          test "$ACP" = success
          test "$EVALUATIONS" = success
          test "$STRESS" = success
          test "$PORTABLE" = success
          test "$CONTAINER_BASELINE" = success
          echo "All required validation coverage passed."
