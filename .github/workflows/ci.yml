name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the CLI and the shipped spec checker have no dependencies.
      - name: Lint
        run: npm run lint

      - name: Index is up to date
        run: node factory/cli.mjs index --check

      - name: Tests
        run: npm test

      - name: Committed example packet verifies
        run: node factory/cli.mjs verify examples/retro-board/spec

      # Dogfooding: this repository is planned, compiled and guarded by its own
      # pipeline. The packet is committed, so it must also match the generator.
      - name: Self-spec packet is in sync with the generator
        run: |
          node factory/cli.mjs compile profile.json -o /tmp/self-spec
          for f in /tmp/self-spec/*.md /tmp/self-spec/spec.json /tmp/self-spec/AGENTS.md /tmp/self-spec/spec-check.mjs; do
            name=$(basename "$f")
            if ! diff -q "$f" "specs/$name" > /dev/null; then
              echo "::error::specs/$name is stale. Run: npm run dogfood"
              exit 1
            fi
          done
          if ! diff -r /tmp/self-spec/enforcement specs/enforcement > /dev/null; then
            echo "::error::specs/enforcement is stale. Run: npm run dogfood"
            exit 1
          fi
          echo "self-spec packet is in sync"

      # The packet ships a gate runner. Dogfooding it against this repository is the
      # only check that proves the generated file executes at all.
      - name: Self-spec gates pass
        run: node specs/enforcement/gates.mjs --repo . --strict


      - name: This repository passes its own drift guard
        run: node specs/spec-check.mjs --repo . --strict

      - name: Library eval (discoverability, collisions, discrimination)
        run: node scripts/eval-library.mjs

      - name: Specificity eval (a packet should not read like a form letter)
        run: node scripts/eval-specificity.mjs

      - name: MCP routing eval (precision >= 0.90, recall >= 0.70, metadata ablation)
        run: node scripts/eval-routing.mjs

      - name: Outcome harness (24 tasks x 3 arms, hidden oracles, defect and drift probes)
        run: node scripts/eval-outcome.mjs

      - name: Ten ideas survive the pipeline
        run: node scripts/stress-test.mjs

      - name: Twenty hostile ideas and six invalid profiles
        run: node scripts/stress-adversarial.mjs

      - name: Adoption runs against this repository
        run: node factory/cli.mjs adopt . -o /tmp/self-profile.json --force

      - name: MCP server answers tools/list
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node factory/cli.mjs mcp 2>/dev/null \
            | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const lines=b.trim().split("\n").map(JSON.parse);const tools=lines.find(l=>l.id===2);if(tools.result.tools.length!==8)process.exit(1);console.log("8 MCP tools advertised")})'

      # A generated delta starts with pending evidence by design. A minimal reviewed-record
      # fixture proves the positive evidence lifecycle; it is test data, never a CI release approval.
      - name: Delta spec and reviewed-evidence round trip
        run: |
          node factory/cli.mjs change init /tmp/change > /dev/null
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/tmp/change/change.json"));delete c.$help;fs.writeFileSync("/tmp/change/change.json",JSON.stringify(c,null,2))'
          node factory/cli.mjs change examples/retro-board/spec /tmp/change/change.json -o /tmp/change/out
          project=/tmp/change-project
          mkdir -p "$project"
          node factory/cli.mjs module enable review --project "$project"
          node - "$project" /tmp/change/out <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [project, change] = process.argv.slice(2);
          const delta = JSON.parse(fs.readFileSync(path.join(change, 'delta.json'), 'utf8'));
          const ids = [...(delta.added ?? []).map((entry) => entry.id), ...(delta.modified ?? []).map((entry) => entry.target.id), ...(delta.removed ?? []).map((entry) => entry.target.id)];
          const review = ['# Review Brief: CI delta evidence', '', '**Status:** Approved', '', '## Change Summary', '', 'The generated delta was reviewed against the resulting manifest, expected blast radius, and release boundary.', '', '## Requirements Under Review', '', ids.map((id) => `- ${id}: Reviewed against acceptance criteria and change evidence.`).join('\n'), '', '## Risk and Invariants', '', 'The review preserves the changed requirements, their failure paths, and the stated verification method.', '', '## Evidence', '', 'The packet and change verification commands completed with no findings before the accountable review.', '', '## Review Questions', '', 'Does every changed requirement retain a falsifiable acceptance criterion and an executable verification path?', '', '## Decision', '', 'Approved after reviewing the linked evidence and the explicit rollback conditions.', ''].join('\n');
          fs.mkdirSync(path.join(project, 'docs'), { recursive: true });
          fs.writeFileSync(path.join(project, 'docs', 'review-brief.md'), review);
          const evidenceFile = path.join(change, 'evidence.json');
          const evidence = JSON.parse(fs.readFileSync(evidenceFile, 'utf8'));
          evidence.artifacts = [{ kind: 'review-brief', file: 'docs/review-brief.md', requirements: ids }];
          fs.writeFileSync(evidenceFile, `${JSON.stringify(evidence, null, 2)}\n`);
          const narrativeFile = path.join(change, 'evidence.md');
          fs.writeFileSync(narrativeFile, fs.readFileSync(narrativeFile, 'utf8').replace('**Status:** Pending', '**Status:** Approved'));
          NODE
          node factory/cli.mjs change verify /tmp/change/out --project "$project"

      # A source checkout can hide omitted package files or an invalid bin link. Exercise
      # the tarball users receive, including compiler, export, mission, module, artifact and
      # reviewed shared-store flows. No registry, credentials or network agent calls.
      - name: Packed-install distribution journey
        run: |
          set -eu
          work=$(mktemp -d)
          pack="$work/pack"
          install="$work/install"
          mkdir -p "$pack"
          npm pack --pack-destination "$pack" > /dev/null
          tarball=$(find "$pack" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          npm install --ignore-scripts --prefix "$install" "$tarball" > /dev/null
          vld="$install/node_modules/.bin/vld"
          "$vld" --version

          cp examples/retro-board/profile.json "$work/profile.json"
          "$vld" compile "$work/profile.json" --out "$work/packet"
          "$vld" verify "$work/packet"
          "$vld" export spec-kit "$work/packet" --out "$work/spec-kit"
          test -f "$work/spec-kit/.specify/memory/constitution.md"

          project="$work/project"
          mkdir -p "$project" "$work/store"
          "$vld" module enable product --project "$project"
          "$vld" store init "$work/store" --id team-playbook --title 'Team playbook'
          cat > "$work/store/product-brief.md" <<'EOF'
          # Product Brief: shared template

          **Status:** Draft

          ## Problem

          [Describe the reviewed problem.]
          EOF
          cat > "$work/store/vld-store.json" <<'EOF'
          {"schemaVersion":1,"id":"team-playbook","title":"Team playbook","assets":[{"id":"product-brief-template","kind":"artifact-template","artifact":"product-brief","file":"product-brief.md"}]}
          EOF
          git -C "$work/store" init -q
          git -C "$work/store" config user.email vld-ci@example.test
          git -C "$work/store" config user.name 'VLD CI'
          git -C "$work/store" add .
          git -C "$work/store" commit -qm initial
          "$vld" store add team-playbook "file://$work/store" --project "$project"
          "$vld" artifact init product-brief --from-store team-playbook/product-brief-template --project "$project"

          # Mission creation must also work from the packed CLI. It reads a verified
          # project-local packet and resolves HEAD, but cannot launch an agent or mutate refs.
          cp -R "$work/packet" "$project/specs"
          git -C "$project" init -q
          git -C "$project" config user.email vld-ci@example.test
          git -C "$project" config user.name 'VLD CI'
          git -C "$project" add specs
          git -C "$project" commit -qm mission-base
          node - "$project" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const project = process.argv[2];
          const requirements = JSON.parse(fs.readFileSync(path.join(project, 'specs', 'spec.json'), 'utf8')).requirements.map((entry) => entry.id);
          const definition = {
            schemaVersion: 1,
            id: 'packed-mission',
            title: 'Verify the packaged mission foundation',
            workPackages: [{
              id: 'packet-work',
              title: 'Verify every packet requirement in one package',
              requirements,
              dependsOn: [],
              resourceClaims: { paths: ['src/**', 'test/**'] }
            }]
          };
          fs.writeFileSync(path.join(project, 'mission-definition.json'), `${JSON.stringify(definition, null, 2)}\n`);
          NODE
          "$vld" mission init mission-definition.json --packet specs --project "$project"
          "$vld" mission validate missions/packed-mission/mission.json --project "$project"
          test -f "$project/missions/packed-mission/mission.json"

          # The packed CLI also owns the narrow manual workspace foundation. This
          # allocation is local fixed-argv Git only: no agent, command runner, push or merge.
          workspace_id=$("$vld" workspace create missions/packed-mission/mission.json packet-work --project "$project" --json \
            | node -e 'let input="";process.stdin.on("data",part=>input+=part).on("end",()=>process.stdout.write(JSON.parse(input).allocation.id))')
          test -n "$workspace_id"
          "$vld" workspace status missions/packed-mission/mission.json --project "$project"
          "$vld" workspace remove missions/packed-mission/mission.json packet-work --project "$project"

          printf '%s\n' '<!-- refreshed -->' >> "$work/store/product-brief.md"
          git -C "$work/store" add .
          git -C "$work/store" commit -qm refresh
          acknowledgement=$("$vld" store diff team-playbook --project "$project" --json | node -e 'let input="";process.stdin.on("data",part=>input+=part).on("end",()=>process.stdout.write(JSON.parse(input).next.commit))')
          "$vld" store update team-playbook --acknowledge "$acknowledgement" --project "$project"
          "$vld" store status team-playbook --project "$project"

      - name: Generated packet is in sync with the generator
        run: |
          node factory/cli.mjs compile examples/retro-board/profile.json -o /tmp/spec
          for f in /tmp/spec/*.md /tmp/spec/spec.json /tmp/spec/AGENTS.md /tmp/spec/spec-check.mjs; do
            name=$(basename "$f")
            if ! diff -q "$f" "examples/retro-board/spec/$name" > /dev/null; then
              echo "::error::examples/retro-board/spec/$name is stale. Run: node factory/cli.mjs compile examples/retro-board/profile.json -o examples/retro-board/spec --force"
              exit 1
            fi
          done
          echo "example packet is in sync"
