# gitleaks configuration for this repository.
#
# The shipped gate-runner scans the working tree; gitleaks scans history, which is
# the half that catches a key that was committed and then deleted. Run both:
#
#   gitleaks detect --config enforcement/gitleaks.toml --redact
#
# Nothing here is a secret: the allowlist is for the fixtures that look like one.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Long literal assigned to a key-shaped name"
regex = '''(?i)(?:api[_-]?key|secret|token|password)\s*[:=]\s*["'][A-Za-z0-9_\-]{20,}["']'''
entropy = 3.5
keywords = ["key", "secret", "token", "password"]

[allowlist]
description = "Fixtures, examples and environment references"
paths = [
  '''(.*)?\.env\.example''',
  '''docs/.*\.md''',
  '''enforcement/.*'''
]
